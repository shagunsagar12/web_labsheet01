<!DOCTYPE html>
<html>
    <head>
        <title>Survey Form</title>
    </head>
    <body>
        <h2>Student Survey Form</h2>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <br><br>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
                <br><br>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age">
            </fieldset>
            <br>
            <fieldset>
                <legend>Eduction Details</legend>
                <label for="Course">Course:</label>
                <select id="course" name="course">
                    <option value="bsc">B.sc</option>
                    <option value="mca">MCA</option>
                    <option value="bca">BCA</option>
                </select>
                <br><br>
                <label>Year:</label>
                <input type="radio" name="year" value="1">Ist
                <input type="radio" name="year" value="2">2nd
                <input type="radio" name="year" value="3">3rd
            </fieldset>
            <br>
            <fieldset>
                <legend>Feedback</legend>
                <label for="feedback">Your Feedback:</label><br>
                <textarea id="feedback" name="feedback" rows="4" cols="40"></textarea>
            </fieldset>
            <br>
            <input type="submit" value="submit Survey"
        </form>
    </body>
</html>
