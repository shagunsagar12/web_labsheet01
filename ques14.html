<!DOCTYPE html>
<html>
    <head>
        <title>Photograph with descriptive caption</title>
    </head>
    <body>
        <h2>Photograph With description</h2>
        <figure>
        <img src="landscape.jpg" alt="Beautiful mountain landscape" width="500">
        <figcaption>
            A beautiful view of the mountains during sunset.
        </figcaption>
    </figure>

    </body>
</html>
