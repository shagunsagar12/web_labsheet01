<!DOCTYPE html>
<html>
    <head>
        <title>Financial Report</title>
    </head>
    <body>
        <h2>Financial Report</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Income</th>
                    <th>Expense</th>
                    <th>Profit</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>January</td>
                    <td>$50,000</td>
                    <td>$30,000</td>
                    <td>$20,000</td>
                </tr>
                <tr>
                    <td>February</td>
                    <td>$60,000</td>
                    <td>$35,000</td>
                    <td>$25,000</td>
                </tr>
                <tr>
                    <td>March</td>
                    <td>$70,000</td>
                    <td>$40,000</td>
                    <td>$30,000</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>$1,80,000</th>
                    <th>$1,05,000</th>
                    <th>$75,000</th>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
