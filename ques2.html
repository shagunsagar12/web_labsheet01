<!DOCTYPE html>
<html>
    <head>
        <title>text formating</title>
    </head>
    <body>
        <h1>HTML TEXT FORMATTING</h1>
        <p><b>This text is bold using b tag</b></p>
        <p><strong>This text is strongly emphasized using strong tag</strong></p>
        <p><i>This text is italic using i tag</i></p>
        <p><em>This text is emphasized using tag</em></p>
        <p><u>This text is underlined using u tag</u></p>
        <p><del>This text is strikethrough using del tag</del></p>
    </body>
</html>
